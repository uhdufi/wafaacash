<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111111">
  <meta name="description" content="Formulaire indépendant de prise de contact pour un projet de partenariat et d'ouverture d'agence Wafacash au Maroc.">
  <title>Projet d'agence Wafacash | Demande de partenariat</title>
  <style>
    :root{
      --black:#111111;--ink:#191919;--muted:#6d6d6d;--yellow:#ffdf00;
      --yellow-dark:#e8c900;--paper:#ffffff;--soft:#f5f5f2;--line:#e8e8e3;
      --green:#17834b;--radius:20px;--shadow:0 18px 55px rgba(0,0,0,.09)
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,Arial,"Noto Sans Arabic",sans-serif;line-height:1.6}
    body[dir="rtl"]{font-family:"Tahoma","Arial",sans-serif}
    a{color:inherit;text-decoration:none}
    button,input,select,textarea{font:inherit}
    button{cursor:pointer}
    .container{width:min(1160px,calc(100% - 40px));margin-inline:auto}
    .top-note{background:#171717;color:#fff;text-align:center;padding:8px 15px;font-size:12px;letter-spacing:.1px}
    .top-note strong{color:var(--yellow)}
    header{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
    .nav{height:82px;display:flex;align-items:center;justify-content:space-between;gap:24px}
    .brand{display:flex;align-items:center;gap:12px;min-width:0}
    .brand img{width:145px;height:auto;object-fit:contain;display:block}
    .brand-caption{border-inline-start:1px solid #ddd;padding-inline-start:13px;color:#666;font-size:11px;line-height:1.35}
    .nav-actions{display:flex;align-items:center;gap:14px}
    .nav-link{font-size:13px;font-weight:700;color:#444}
    .lang-switch{border:1px solid #dedede;background:#fff;border-radius:999px;padding:9px 14px;font-weight:800;font-size:12px}
    .lang-switch:hover{background:var(--yellow);border-color:var(--yellow)}
    .hero{background:var(--black);color:#fff;position:relative;overflow:hidden;padding:76px 0 82px}
    .hero:before{content:"";position:absolute;width:560px;height:560px;border-radius:50%;background:var(--yellow);opacity:.12;inset-inline-end:-180px;top:-260px;filter:blur(2px)}
    .hero:after{content:"";position:absolute;width:360px;height:360px;border:1px solid rgba(255,223,0,.25);border-radius:50%;inset-inline-end:6%;bottom:-270px}
    .hero-grid{display:grid;grid-template-columns:1.12fr .88fr;align-items:center;gap:60px;position:relative;z-index:1}
    .eyebrow{display:inline-flex;align-items:center;gap:9px;color:var(--yellow);font-weight:800;font-size:12px;letter-spacing:1.3px;text-transform:uppercase}
    .eyebrow:before{content:"";width:25px;height:2px;background:var(--yellow)}
    h1{font-size:clamp(38px,5.2vw,66px);line-height:1.08;letter-spacing:-2px;margin:20px 0 18px;max-width:700px}
    h1 span{color:var(--yellow)}
    .hero-copy{color:#d0d0d0;max-width:570px;font-size:16px;margin:0 0 28px}
    .primary-btn{display:inline-flex;align-items:center;justify-content:center;gap:12px;background:var(--yellow);color:#111;border:0;border-radius:10px;padding:15px 23px;font-weight:900;box-shadow:0 8px 24px rgba(255,223,0,.16);transition:.2s}
    .primary-btn:hover{background:#fff;transform:translateY(-2px)}
    .hero-points{display:flex;flex-wrap:wrap;gap:18px;margin-top:28px;color:#ddd;font-size:12px}
    .hero-points span{display:flex;align-items:center;gap:7px}
    .tick{display:inline-grid;place-items:center;width:19px;height:19px;border-radius:50%;background:var(--yellow);color:#111;font-weight:900}
    .visual-card{background:#fff;color:#111;border-radius:22px;padding:25px;box-shadow:0 25px 70px rgba(0,0,0,.3);transform:rotate(1.5deg);max-width:420px;margin-inline:auto}
    .visual-head{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #eee;padding-bottom:17px}
    .visual-head img{width:118px;height:auto}
    .visual-label{background:#fff5a8;padding:6px 10px;border-radius:6px;font-size:10px;font-weight:900}
    .visual-title{font-size:21px;font-weight:900;line-height:1.25;margin:23px 0 8px}
    .visual-sub{font-size:12px;color:#777;margin:0 0 20px}
    .visual-row{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid #eee;font-size:12px}
    .visual-icon{width:36px;height:36px;display:grid;place-items:center;background:#fff6a8;border-radius:10px;font-weight:900}
    .visual-row b{display:block;font-size:12px}
    .visual-row small{color:#888}
    .visual-bottom{display:flex;align-items:center;justify-content:space-between;margin-top:20px;font-size:11px;color:#777}
    .visual-bottom strong{font-size:18px;color:#111}
    .section{padding:82px 0}
    .section.soft{background:var(--soft)}
    .section-head{text-align:center;max-width:690px;margin:0 auto 42px}
    .kicker{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:#8a7600;font-weight:900}
    h2{font-size:clamp(28px,3.4vw,42px);line-height:1.18;letter-spacing:-1px;margin:10px 0 12px;color:#111}
    .section-head p{color:var(--muted);margin:0}
    .benefits{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
    .benefit{background:#fff;border:1px solid var(--line);border-radius:16px;padding:25px;min-height:190px}
    .benefit-icon{width:46px;height:46px;border-radius:13px;background:#fff5a6;display:grid;place-items:center;font-size:21px;margin-bottom:18px;color:#111}
    .benefit h3{font-size:17px;margin:0 0 8px}
    .benefit p{font-size:13px;color:#777;margin:0}
    .form-layout{display:grid;grid-template-columns:.72fr 1.28fr;gap:42px;align-items:start}
    .form-aside{background:#111;color:#fff;border-radius:20px;padding:30px;position:sticky;top:110px}
    .form-aside h3{font-size:25px;line-height:1.2;margin:0 0 14px}
    .form-aside p{font-size:13px;color:#c8c8c8}
    .aside-list{list-style:none;padding:0;margin:25px 0 0}
    .aside-list li{display:flex;gap:11px;align-items:flex-start;margin:15px 0;color:#eee;font-size:13px}
    .aside-list .tick{flex:none}
    .contact-mini{border-top:1px solid #393939;margin-top:25px;padding-top:18px;font-size:12px;color:#bbb}
    .contact-mini a{color:var(--yellow);font-weight:800}
    form{background:#fff;border:1px solid var(--line);border-radius:20px;padding:32px;box-shadow:var(--shadow)}
    .form-title{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:24px}
    .form-title h3{font-size:22px;margin:0}
    .required-note{font-size:11px;color:#888}
    .form-section-title{font-size:13px;font-weight:900;margin:25px 0 14px;padding-bottom:9px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:9px}
    .form-section-title span{width:25px;height:25px;border-radius:50%;background:var(--yellow);display:grid;place-items:center;font-size:11px}
    .fields{display:grid;grid-template-columns:1fr 1fr;gap:16px}
    .field{display:flex;flex-direction:column;gap:7px;min-width:0}
    .field.full{grid-column:1/-1}
    label{font-size:12px;font-weight:800;color:#333}
    label i{color:#c00;font-style:normal}
    input,select,textarea{width:100%;border:1px solid #deded9;border-radius:9px;background:#fff;padding:13px 13px;color:#171717;outline:none;transition:.2s}
    input:focus,select:focus,textarea:focus{border-color:#c4a900;box-shadow:0 0 0 3px rgba(255,223,0,.2)}
    input::placeholder,textarea::placeholder{color:#aaa}
    textarea{min-height:110px;resize:vertical}
    .hint{font-size:10px;color:#888}
    .checkline{display:flex;align-items:flex-start;gap:10px;margin:22px 0;font-size:11px;color:#666}
    .checkline input{width:17px;height:17px;flex:none;margin-top:2px;accent-color:#111}
    .submit-row{display:flex;align-items:center;gap:15px;flex-wrap:wrap}
    .submit-btn{background:#111;color:#fff;border:0;border-radius:10px;padding:15px 22px;font-weight:900;min-width:220px;transition:.2s}
    .submit-btn:hover{background:var(--yellow);color:#111}
    .secure-note{font-size:10px;color:#888;max-width:240px}
    .status{display:none;margin-top:18px;padding:14px;border-radius:10px;font-size:12px}
    .status.success{display:block;background:#e9f7ef;color:#146c3b;border:1px solid #bfe8ce}
    .status.error{display:block;background:#fff0f0;color:#a32222;border:1px solid #f1c5c5}
    .steps{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;counter-reset:step}
    .step{border-top:3px solid var(--yellow);padding:22px 20px;background:#fff;border-radius:0 0 14px 14px}
    .step-no{font-size:12px;color:#9b8500;font-weight:900}
    .step h3{margin:8px 0;font-size:17px}
    .step p{font-size:12px;color:#777;margin:0}
    footer{background:#111;color:#fff;padding:34px 0}
    .footer-inner{display:flex;align-items:center;justify-content:space-between;gap:20px}
    .footer-inner img{width:125px;background:#fff;border-radius:5px;padding:5px}
    .footer-text{font-size:10px;color:#aaa;max-width:560px}
    .footer-text a{color:var(--yellow);text-decoration:underline}
    .footer-copy{font-size:10px;color:#777;white-space:nowrap}
    .contact-mini{line-height:2}
    .contact-mini a{display:inline-block;direction:ltr;unicode-bidi:embed}
    input[type="tel"],input[type="email"],input[type="number"]{direction:ltr;text-align:left}
    [dir="rtl"] .fields .field{text-align:right}
    [dir="rtl"] .fields input:not([type="tel"]):not([type="email"]):not([type="number"]),
    [dir="rtl"] .fields textarea{ text-align:right; direction:rtl}
    [dir="rtl"] .fields select{direction:rtl;text-align:right}
    [dir="rtl"] .contact-mini{text-align:right;line-height:2.15}
    [dir="rtl"] .contact-mini a{margin-inline-start:0;margin-inline-end:0}
    [dir="rtl"] .checkline{flex-direction:row}
    [dir="rtl"] .form-section-title{flex-direction:row}
    [dir="rtl"] .submit-row{flex-direction:row}
    [dir="rtl"] .eyebrow{letter-spacing:0}
    [dir="rtl"] h1,[dir="rtl"] h2,[dir="rtl"] .section-head{text-align:right}
    [dir="rtl"] .hero-copy{margin-inline-start:0;margin-inline-end:auto}
    [dir="rtl"] .form-title,[dir="rtl"] .footer-inner{direction:rtl}
    [dir="rtl"] .form-aside{text-align:right}
    [dir="rtl"] .visual-card{transform:rotate(-1.5deg)}
    @media(max-width:850px){
      .hero-grid,.form-layout{grid-template-columns:1fr;gap:34px}
      .hero{padding:58px 0}
      .visual-card{width:min(100%,440px)}
      .form-aside{position:static}
      .benefits{grid-template-columns:1fr 1fr}
    }
    @media(max-width:600px){
      .container{width:min(100% - 28px,1160px)}
      .nav{height:68px}.brand img{width:112px}.brand-caption,.nav-link{display:none}
      .hero{padding:48px 0 55px}
      h1{font-size:39px;letter-spacing:-1.2px}
      .hero-copy{font-size:14px}
      .visual-card{padding:19px}
      .section{padding:58px 0}
      .benefits,.steps{grid-template-columns:1fr}
      form{padding:20px 16px}
      .fields{grid-template-columns:1fr}
      .field.full{grid-column:auto}
      .form-title{align-items:flex-start;flex-direction:column}
      .submit-btn{width:100%}
      .footer-inner{align-items:flex-start;flex-direction:column}
      .footer-copy{white-space:normal}
    }

    /* --- Logo contrast & visual refinement (v2) --- */
    .brand img,
    .visual-head img,
    footer .footer-inner > img {
      display:block;
      width:165px;
      height:auto;
      max-width:100%;
      object-fit:contain;
      object-position:center;
      background:#111111;
      padding:7px 10px;
      border-radius:9px;
      box-shadow:0 3px 12px rgba(0,0,0,.12);
    }
    .brand {gap:15px}
    .brand-caption {
      border-inline-start:1px solid #d8d8d8;
      padding-inline-start:15px;
      font-size:12px;
      line-height:1.45;
    }
    .visual-head {
      gap:16px;
      min-height:67px;
    }
    .visual-head img {width:155px}
    footer .footer-inner > img {
      width:155px;
      background:#111;
      border:1px solid #444;
    }
    .hero {isolation:isolate}
    .hero:before {pointer-events:none}
    .visual-card {
      border:1px solid rgba(0,0,0,.06);
      transform:rotate(0);
      transition:transform .25s ease, box-shadow .25s ease;
    }
    .visual-card:hover {
      transform:translateY(-4px);
      box-shadow:0 30px 80px rgba(0,0,0,.34);
    }
    .benefit {
      transition:transform .2s ease, box-shadow .2s ease;
    }
    .benefit:hover {
      transform:translateY(-4px);
      box-shadow:0 14px 32px rgba(0,0,0,.07);
    }
    .lang-switch:focus-visible,
    .primary-btn:focus-visible,
    .submit-btn:focus-visible,
    a:focus-visible,
    input:focus-visible,
    select:focus-visible,
    textarea:focus-visible {
      outline:3px solid rgba(232,201,0,.55);
      outline-offset:3px;
    }
    @media(max-width:600px) {
      .brand img {width:138px;padding:7px 9px}
      .visual-head img {width:138px}
      footer .footer-inner > img {width:145px}
      .brand {gap:10px}
      .brand-caption {font-size:10px;padding-inline-start:10px}
    }

  </style>
</head>

  <main>
    <section class="hero" id="accueil">
      <div class="container hero-grid">
        <div>
          <div class="eyebrow" data-fr="DONNEZ VIE À VOTRE PROJET" data-ar="حوّل مشروعك إلى واقع"></div>

    const translations = document.querySelectorAll("[data-fr][data-ar]");
    const langButton = document.getElementById("languageToggle");
    let currentLang = "fr";

    function setLanguage(lang) {
      currentLang = lang;
      document.documentElement.lang = lang;
      document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
      translations.forEach(el => {
        el.innerHTML = el.dataset[lang];
      });
      document.querySelectorAll("option[data-fr][data-ar]").forEach(option => {
        option.textContent = option.dataset[lang];
      });
      document.querySelectorAll("[data-placeholder-fr][data-placeholder-ar]").forEach(field => {
        field.placeholder = field.dataset["placeholder" + (lang === "fr" ? "Fr" : "Ar")];
      });
      document.querySelectorAll("#agencyForm input:not([type=tel]):not([type=email]):not([type=number]), #agencyForm textarea").forEach(field => {
        field.dir = lang === "ar" ? "rtl" : "ltr";
        field.style.textAlign = lang === "ar" ? "right" : "left";
      });
      document.querySelectorAll("#agencyForm select").forEach(field => {
        field.dir = lang === "ar" ? "rtl" : "ltr";
        field.style.textAlign = lang === "ar" ? "right" : "left";
      });
      langButton.textContent = lang === "fr" ? "العربية" : "Français";
      langButton.setAttribute("aria-label", lang === "fr" ? "Passer en arabe" : "Passer en français");
      document.title = lang === "fr"
        ? "Projet d'agence Wafacash | Demande de partenariat"
        : "مشروع وكالة وفاكاش | طلب شراكة";
    }

    langButton.addEventListener("click", () => {
      setLanguage(currentLang === "fr" ? "ar" : "fr");
    });

    document.getElementById("year").textContent = new Date().getFullYear();

    const form = document.getElementById("agencyForm");
    const statusBox = document.getElementById("formStatus");

    form.addEventListener("submit", function(event) {
      event.preventDefault();
      statusBox.className = "status";
      const requiredFields = ["fullname", "phone", "profile", "city", "district"];
      let valid = true;

      requiredFields.forEach(id => {
        const field = document.getElementById(id);
        if (!field.value.trim()) {
          field.style.borderColor = "#c62828";
          valid = false;
        } else {
          field.style.borderColor = "";
        }
      });

      const phone = document.getElementById("phone");
      const phoneClean = phone.value.replace(/[^\d+]/g, "");
      if (phoneClean.length < 9) {
        phone.style.borderColor = "#c62828";
        valid = false;
      }

      if (!document.getElementById("consent").checked) valid = false;

      if (!valid) {
        statusBox.textContent = currentLang === "fr"
          ? "Veuillez remplir les champs obligatoires et accepter la notice avant de continuer."
          : "يرجى ملء الخانات الإجبارية والموافقة على الإشعار قبل المتابعة.";
        statusBox.classList.add("error");
        statusBox.scrollIntoView({behavior:"smooth", block:"nearest"});
        return;
      }

      const labels = currentLang === "fr" ? {
        subject:"Demande de partenariat – Projet d'agence",
        fullname:"Nom complet", phone:"Téléphone", email:"E-mail", profile:"Situation",
        city:"Ville", district:"Quartier / Commune", address:"Adresse du local",
        premises:"Disponibilité du local", surface:"Surface (m²)", experience:"Expérience",
        budget:"Budget estimé", message:"Présentation du projet"
      } : {
        subject:"طلب شراكة – مشروع فتح وكالة",
        fullname:"الاسم الكامل", phone:"الهاتف", email:"البريد الإلكتروني", profile:"الوضعية",
        city:"المدينة", district:"الحي / الجماعة", address:"عنوان المحل",
        premises:"توفر المحل", surface:"المساحة (م²)", experience:"الخبرة",
        budget:"الميزانية التقديرية", message:"تفاصيل المشروع"
      };

      const ids = ["fullname","phone","email","profile","city","district","address","premises","surface","experience","budget","message"];
      const lines = ids.map(id => {
        const el = document.getElementById(id);
        const value = el.value.trim() || (currentLang === "fr" ? "Non renseigné" : "غير محدد");
        return labels[id] + " : " + value;
      });

      const subject = encodeURIComponent(labels.subject);
      const body = encodeURIComponent(lines.join("\n") + "\n\n" +
        (currentLang === "fr"
          ? "Demande préparée via un formulaire indépendant. Merci de m'indiquer la procédure officielle."
          : "تم إعداد الطلب عبر استمارة مستقلة. المرجو إخباري بالمسطرة الرسمية."));
      statusBox.textContent = currentLang === "fr"
        ? "Votre demande est prête. Votre application e-mail va s'ouvrir : vérifiez les informations puis envoyez le message."
        : "طلبك جاهز. سيفتح تطبيق البريد: راجع المعلومات ثم أرسل الرسالة.";
      statusBox.classList.add("success");
      window.location.href = "mailto:contact@wafacash.com?subject=" + subject + "&body=" + body;
    });

    setLanguage("fr");
  </script>
