<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f6d949"><title>شكرًا لاهتمامك</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;background:#f6d949;color:#26301e;font-family:Tahoma,Arial,sans-serif;overflow-x:hidden;padding:30px}body:before,body:after{content:'';position:fixed;width:70vw;height:70vw;border:1px solid #26301e12;border-radius:50%;pointer-events:none;z-index:-1}body:before{top:-50vw;left:-15vw}body:after{bottom:-50vw;right:-15vw}.thank{text-align:center;width:min(620px,100%);animation:enter .8s cubic-bezier(.2,.8,.2,1) both}.brand{font-size:11px;letter-spacing:1px;font-weight:bold;display:block;margin-bottom:58px;color:#4b5633}.icon{width:110px;height:110px;margin:0 auto 35px;border-radius:50%;background:#26301e;color:#f6d949;display:grid;place-items:center;box-shadow:0 0 0 14px #26301e08}.icon svg{width:65px;height:65px}.icon path{stroke-dasharray:70;stroke-dashoffset:70;animation:check .8s .3s forwards}.kicker{font-size:12px;color:#526034;font-weight:bold}h1{font-size:clamp(29px,5vw,44px);line-height:1.6;margin:15px 0}p{font-size:16px;line-height:2.1;max-width:470px;margin:0 auto;color:#475334}.line{width:45px;height:3px;border-radius:5px;background:#26301e45;margin:35px auto 0}@keyframes enter{from{opacity:0;transform:translateY(25px)}to{opacity:1;transform:none}}@keyframes check{to{stroke-dashoffset:0}}@media(prefers-reduced-motion:reduce){*{animation:none!important}.icon path{stroke-dashoffset:0}}@media(max-width:500px){body{padding:24px}.brand{margin-bottom:44px}p{font-size:14px}.icon{width:90px;height:90px}}
</style></head><body><main class="thank"><span class="brand">PROJET D’AGENCE</span><div class="icon" aria-hidden="true"><svg viewBox="0 0 60 60" fill="none"><path d="M14 30L25 41L46 19" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg></div><span class="kicker" id="kicker">خطوة أقرب إلى مشروعك</span><h1 id="title">شكرًا لاهتمامك بمشروع الوكالة</h1><p id="message">اكتملت تعبئة بياناتك بنجاح. شكرًا على الوقت الذي خصّصته للتعريف بمشروعك.</p><div class="line" aria-hidden="true"></div></main><script>if(new URLSearchParams(location.search).get('lang')==='fr'){document.documentElement.lang='fr';document.documentElement.dir='ltr';document.title='Merci pour votre intérêt';document.getElementById('kicker').textContent='UN PAS DE PLUS VERS VOTRE PROJET';document.getElementById('title').textContent='Merci pour votre intérêt';document.getElementById('message').textContent='Vous avez terminé de renseigner vos informations. Merci d’avoir pris le temps de présenter votre projet.';}</script></body></html>
